<body>
    <div class="">
        <div class="row bg-m">
            <div class="col big-head">
                <h1> Robert's Lock & Key</h1>
                <h6> Providing premier locksmith solutions for Albuquerque and it's
                    neighboring communities, catering to all your lock & key needs.
                </h6>
                <div class="call-btn">
                    <a href="tel:5058335625" class="download-button btn btn-dark btn-lg" role="button"><i class="bi bi-telephone-fill"></i> Call Us
                    </a>
                </div>
            </div>
            <div class="col">
                <div class="right-group">
                    <h4 class="l-mode"> Dark</h4>
                    <h4 class="d-mode"> Light</h4>
                    <div class="toggle">
                        <input type="checkbox" id="toggle" />
                        <label for="toggle"></label>
                    </div>
                    <div class="bg-img-fm">
                        <div>
                            <h3>

                            </h3>
                        </div>
                        <div class="bg-image">
                            <img src="images/vin.webp" class="bg-img-ph" alt="image not available" />
                        </div>
                    </div>
                </div>
            </div>
            <script>
                const toggle = document.getElementById('toggle');
                const body = document.body;

                toggle.addEventListener('input', e => {
                    const isChecked = e.target.checked;

                    if (isChecked) {
                        body.classList.add('dark-theme');
                    } else {
                        body.classList.remove('dark-theme');
                    }
                });
            </script>
