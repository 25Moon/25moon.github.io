<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="p1winC">
        <div class="claw hidden"></div>
        <div class="claw hidden"></div>
        <div class="claw hidden"></div>
        <div class="claw hidden"></div>
        <div class="claw last hidden"></div>

    </div>
    <div class="p2winC">
        <div class="claw hidden"></div>
        <div class="claw hidden"></div>
        <div class="claw hidden"></div>
        <div class="claw hidden"></div>
        <div class="claw last hidden"></div>

    </div>
    <h2>Dice Game</h2>
    <h4>Each player gets 3 rolls, they can choose to skip but the one with the highest at the end wins</h4>
    <div class="container">
        <h2 class="outcome"></h2>
    </div>
    <div class="container dicon">
        <div class="dice dice1 p1">
            <div class="dot"></div>
        </div>
        <div class="dice dice2 p1 hidden">
            <div class="dot1 dot"></div>
            <div class="dot2 dot"></div>
        </div>
        <div class="dice dice3 p1 hidden">
            <div class="dot1 dot"></div>
            <div class="dot3 dot"></div>
            <div class="dot2 dot"></div>
        </div>
        <div class="dice dice4 p1 hidden">
            <div class="dot1 dot"></div>
            <div class="dot2 dot"></div>
            <div class="dot3 dot"></div>
            <div class="dot4 dot"></div>
        </div>
        <div class="dice dice5 p1 hidden">
            <div class="dot1 dot"></div>
            <div class="dot2 dot"></div>
            <div class="dot3 dot"></div>
            <div class="dot4 dot"></div>
            <div class="dot5 dot"></div>
        </div>
        <div class="dice dice6 p1 hidden">
            <div class="dot1 dot"></div>
            <div class="dot2 dot"></div>
            <div class="dot3 dot"></div>
            <div class="dot4 dot"></div>
            <div class="dot5 dot"></div>
            <div class="dot6 dot"></div>
        </div>
<!--        -->
        <div class="dice dice1 p2">
            <div class="dot"></div>
        </div>
        <div class="dice dice2 p2 hidden">
            <div class="dot1 dot"></div>
            <div class="dot2 dot"></div>
        </div>
        <div class="dice dice3 p2 hidden">
            <div class="dot1 dot"></div>
            <div class="dot3 dot"></div>
            <div class="dot2 dot"></div>
        </div>
        <div class="dice dice4 p2 hidden">
            <div class="dot1 dot"></div>
            <div class="dot2 dot"></div>
            <div class="dot3 dot"></div>
            <div class="dot4 dot"></div>
        </div>
        <div class="dice dice5 p2 hidden">
            <div class="dot1 dot"></div>
            <div class="dot2 dot"></div>
            <div class="dot3 dot"></div>
            <div class="dot4 dot"></div>
            <div class="dot5 dot"></div>
        </div>
        <div class="dice dice6 p2 hidden">
            <div class="dot1 dot"></div>
            <div class="dot2 dot"></div>
            <div class="dot3 dot"></div>
            <div class="dot4 dot"></div>
            <div class="dot5 dot"></div>
            <div class="dot6 dot"></div>
        </div>
    </div>
    <div class="container">
        <div class="container-mini">
            <h1>Player 1</h1>
            <h3 class="p1-rolls-left">3 Rolls Left</h3>
            <button class="btn btn-r1">Roll</button>
            <button class="btn btn-s1">Skip</button>
        </div>
        <div class="container-mini">
            <h1>Player 2</h1>
            <h3 class="p2-rolls-left">3 Rolls Left</h3>
            <button class="btn btn-r2">Roll</button>
            <button class="btn btn-s2">Skip</button>
        </div>
    </div>
    <script src="index.js" charset="utf-8"></script>

</body>
</html>
